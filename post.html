<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/yellow.css">
  <link rel="stylesheet" href="/assets/css/blog.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="site-wrapper">
    <header class="site-header">
      <div class="site-title"><a href="/">{{ site.title }}</a></div>
      <nav class="site-nav">
        <a href="/">Home</a>
        <a href="/#papers">Papers</a>
        <a href="/#talks">Talks</a>
        <a href="/blog/">Blog</a>
      </nav>
    </header>

    <main class="page-content">
      <article class="post-article">
        <header class="post-article-header">
          <h1 class="post-article-title">{{ page.title }}</h1>
          <div class="post-article-meta">
            {{ page.date | date: "%b %-d, %Y" }}  &bull;  Written By Daking Rai
          </div>
        </header>

        <div class="post-article-body">
          {{ content }}
        </div>

        <footer class="post-article-footer">
          <a href="/blog/">&larr; Back to all posts</a>
        </footer>
      </article>
    </main>
  </div>

</body>
</html>
